openapi: 3.0.0
info:
  title: ClippingBD Studio API
  description: Comprehensive REST API for ClippingBD Studio - Image Editing & Video Production Platform
  version: 1.0.0
  contact:
    email: support@clippingbd.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://clippingbd.com
    description: Production server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns system status and connectivity info
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Unhealthy

  # ============ AUTH ============
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      responses:
        '200':
          description: Logout successful

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      responses:
        '200':
          description: Current user info

  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'

  # ============ USERS ============
  /api/users:
    get:
      tags:
        - Users
      summary: List users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [CLIENT, EDITOR, QA, ADMIN, DEVELOPER]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, PENDING]
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated user list

    put:
      tags:
        - Users
      summary: Update user (self or admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated

  # ============ ORDERS ============
  /api/orders:
    get:
      tags:
        - Orders
      summary: List orders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING, IN_PROGRESS, QA, COMPLETED, DELIVERED, REVISION, CANCELLED]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
            type: integer
      responses:
        '200':
          description: Paginated order list

    post:
      tags:
        - Orders
      summary: Create new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created

    put:
      tags:
        - Orders
      summary: Update order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'

  # ============ TASKS ============
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, ASSIGNED, IN_PROGRESS, SUBMITTED, APPROVED, REJECTED]
        - name: serviceType
          in: query
          schema:
            type: string

    put:
      tags:
        - Tasks
      summary: Update task (submit, progress)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'

  # ============ SERVICES ============
  /api/services:
    get:
      tags:
        - Services
      summary: List all services (public)
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: slug
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Service list

  # ============ UPLOADS ============
  /api/upload:
    post:
      tags:
        - Uploads
      summary: Upload file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                bucket:
                  type: string
                path:
                  type: string
                orderId:
                  type: string
                isPublic:
                  type: boolean
      responses:
        '201':
          description: File uploaded

  # ============ CMS ============
  /api/cms/settings:
    get:
      tags:
        - CMS
      summary: Get global settings (admin only)
      security:
        - bearerAuth: []
    put:
      tags:
        - CMS
      summary: Update global settings (admin only)
      security:
        - bearerAuth: []

  /api/cms/hero:
    get:
      tags:
        - CMS
      summary: Get hero content (public)

  /api/cms/services:
    get:
      tags:
        - CMS
      summary: Get all services (public)

  # ============ PAYMENTS ============
  /api/admin/payment-gateways:
    get:
      tags:
        - Payments (Admin)
      summary: List payment gateways (admin only)
      security:
        - bearerAuth: []

    post:
      tags:
        - Payments (Admin)
      summary: Create payment gateway (admin only)
      security:
        - bearerAuth: []

    put:
      tags:
        - Payments (Admin)
      summary: Update payment gateway (admin only)
      security:
        - bearerAuth: []

    delete:
      tags:
        - Payments (Admin)
      summary: Delete payment gateway (admin only)
      security:
        - bearerAuth: []

  /api/payments/webhooks/stripe:
    post:
      tags:
        - Payments (Webhooks)
      summary: Stripe webhook endpoint
      # No auth - Stripe calls this directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

  # ============ ADMIN ============
  /api/admin/statistics:
    get:
      tags:
        - Admin
      summary: Get platform statistics (admin only)
      security:
        - bearerAuth: []

  /api/admin/users/approval:
    get:
      tags:
        - Admin
      summary: Get pending user approvals (admin only)
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        database:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    SignupRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [CLIENT, EDITOR, QA]

    UserUpdate:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CLIENT, EDITOR, QA, ADMIN, DEVELOPER]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, PENDING]

    OrderCreate:
      type: object
      required:
        - title
        - quantity
      properties:
        serviceId:
          type: string
        title:
          type: string
        description:
          type: string
        quantity:
          type: integer
        priority:
          type: string
          enum: [STANDARD, EXPRESS, NITRO]
        deadline:
          type: string
          format: date

    OrderUpdate:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING, IN_PROGRESS, QA, COMPLETED, DELIVERED, REVISION]

    TaskUpdate:
      type: object
      required:
        - taskId
      properties:
        taskId:
          type: string
        status:
          type: string
          enum: [AVAILABLE, ASSIGNED, IN_PROGRESS, SUBMITTED, APPROVED, REJECTED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        revisionNotes:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [GUEST, CLIENT, EDITOR, QA, ADMIN, DEVELOPER]
        walletBalance:
          type: number
        avatar:
          type: string
          format: uri

tags:
  - name: System
    description: System health and status
  - name: Authentication
    description: User authentication endpoints
  - name: Users
    description: User management
  - name: Orders
    description: Order management
  - name: Tasks
    description: Task management for editors/QA
  - name: Services
    description: Service catalog (public)
  - name: Uploads
    description: File uploads
  - name: CMS
    description: Content management
  - name: Payments
    description: Payment processing and webhooks
  - name: Admin
    description: Administrative functions
